<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Open to SDE roles. Let's build something that stays up. bnmanubharadwaj@gmail.com" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b14"/><stop offset="1" stop-color="#12122b"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="0.55" stop-color="#67e8f9"/><stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="clip"><rect width="1000" height="210" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="210" fill="url(#bg)"/>
    <ellipse cx="140" cy="210" rx="260" ry="90" fill="#7c5cff" opacity="0.34" filter="url(#blur)"/>
    <ellipse cx="860" cy="0" rx="280" ry="90" fill="#22d3ee" opacity="0.22" filter="url(#blur)"/>
    <ellipse cx="500" cy="230" rx="200" ry="60" fill="#ff7ac6" opacity="0.16" filter="url(#blur)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="209" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <g text-anchor="middle">
    <text x="500" y="52" font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="12" letter-spacing="5" fill="#67e8f9">// OPEN TO SDE ROLES</text>
    <text x="500" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="url(#head)">Let's build something that stays up.</text>
    <text x="500" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9aa3c7">Send me a problem. I'll send back a solution, a deployment and a load test.</text>
    <rect x="350" y="148" width="300" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="500" y="172" font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="15" fill="#a5f3fc">bnmanubharadwaj@gmail.com</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
