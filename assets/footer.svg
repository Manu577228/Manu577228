<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Contact Manu Bharadwaj" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14082e"/>
      <stop offset="0.6" stop-color="#4a1260"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d1"/>
      <stop offset="1" stop-color="#ffc2dc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="230" rx="20"/></clipPath>
    <path id="petal" d="M0,0 C5,-9 17,-7 15,2 C13,11 2,11 0,0 Z"/>
  </defs>
  <style>
    .t { font-family: 'Segoe UI','Helvetica Neue',Arial,'Nirmala UI','Noto Sans Devanagari','Mangal',sans-serif; }
    .petal { fill: #ffb7d5; opacity: .9; animation: fall 9s linear infinite; }
    @keyframes fall {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: .95; }
      100% { transform: translate(-150px, 260px) rotate(500deg); opacity: .2; }
    }
    .moon { animation: pulse 5s ease-in-out infinite; transform-origin: 160px 80px; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .cta { animation: glowp 2.4s ease-in-out infinite; }
    @keyframes glowp { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#sky)"/>
    <g fill="#fff">
      <circle class="tw" cx="420" cy="30" r="1.5"/>
      <circle class="tw" cx="560" cy="52" r="1.2" style="animation-delay:-1s"/>
      <circle class="tw" cx="700" cy="24" r="1.7" style="animation-delay:-2s"/>
      <circle class="tw" cx="820" cy="60" r="1.2" style="animation-delay:-.6s"/>
      <circle class="tw" cx="930" cy="28" r="1.6" style="animation-delay:-1.6s"/>
      <circle class="tw" cx="300" cy="48" r="1.2" style="animation-delay:-2.4s"/>
    </g>

    <g class="moon" filter="url(#glow)"><circle cx="160" cy="80" r="54" fill="url(#moon)"/></g>

    <path d="M0 230 L0 176 L120 140 L230 176 L350 126 L470 172 L600 134 L720 178 L840 138 L940 172 L1000 150 L1000 230 Z" fill="#1b0a36" opacity=".9"/>
    <path d="M0 230 L0 200 L160 178 L300 204 L450 172 L600 206 L760 178 L900 204 L1000 186 L1000 230 Z" fill="#0b0419"/>

    <g>
      <use href="#petal" class="petal" x="900" y="-20" style="animation-delay:-1s"/>
      <use href="#petal" class="petal" x="740" y="-20" style="animation-delay:-4s;animation-duration:11s"/>
      <use href="#petal" class="petal" x="620" y="-20" style="animation-delay:-2.5s;animation-duration:10s"/>
      <use href="#petal" class="petal" x="1000" y="-20" style="animation-delay:-6s;animation-duration:8s"/>
      <use href="#petal" class="petal" x="500" y="-20" style="animation-delay:-7s;animation-duration:12s"/>
    </g>

    <g class="t" text-anchor="middle">
      <text x="560" y="74" font-size="15" font-weight="800" letter-spacing="5" fill="#4de1ff">NEXT CHAPTER</text>
      <text x="560" y="122" font-size="38" font-weight="900" fill="#ffffff" filter="url(#glow)">आपके संदेश की प्रतीक्षा रहेगी</text>
      <text x="560" y="156" font-size="15" font-weight="700" letter-spacing="2.5" fill="#ffd6e8">THE NEXT CHAPTER STARTS WITH YOUR EMAIL</text>
      <text class="cta" x="560" y="192" font-size="19" font-weight="800" letter-spacing="1.5" fill="#fff3b0">bnmanubharadwaj@gmail.com</text>
    </g>

    <rect x="1.5" y="1.5" width="997" height="227" rx="19" fill="none" stroke="#ff4f8b" stroke-opacity=".55" stroke-width="3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
