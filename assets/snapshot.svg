<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="Key numbers: LeetCode global rank 41, 800+ problems solved, 30 projects shipped, 0% failures at 200 users, 3.32K subscribers" xmlns:c2pa="http://c2pa.org/manifest">
