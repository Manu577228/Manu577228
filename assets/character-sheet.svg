<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-label="Character sheet: Manu Bharadwaj" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a2a"/>
      <stop offset="1" stop-color="#1d0d3a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#4de1ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#4de1ff"/>
    </linearGradient>
    <linearGradient id="rank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .t { font-family: 'Segoe UI','Helvetica Neue',Arial,'Nirmala UI','Noto Sans Devanagari','Noto Sans Kannada','Mangal','Tunga',sans-serif; }
    .fill { transform-box: fill-box; transform-origin: left center; animation: grow 1.8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .ring { transform-origin: 850px 240px; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ring2 { transform-origin: 850px 240px; animation: spin 40s linear infinite reverse; }
    .pulse { animation: pl 2.6s ease-in-out infinite; }
    @keyframes pl { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  </style>

  <rect x="2" y="2" width="996" height="486" rx="20" fill="url(#bg)" stroke="url(#edge)" stroke-width="3"/>

  <!-- header -->
  <g class="t">
    <text x="40" y="52" font-size="26" font-weight="900" letter-spacing="4" fill="#ffffff">CHARACTER SHEET</text>
    <text x="400" y="52" font-size="16" font-weight="700" fill="#ff8fc0">पात्र परिचय</text>
    <text x="505" y="52" font-size="16" font-weight="700" fill="#ffd6e8">·</text>
    <text x="525" y="52" font-size="16" font-weight="700" fill="#ff8fc0">ಪಾತ್ರ ಪರಿಚಯ</text>
    <text x="40" y="84" font-size="13" fill="#b9b3d9">NAME  <tspan fill="#fff" font-weight="700">Manu Bharadwaj</tspan>     CLASS  <tspan fill="#fff" font-weight="700">Full-Stack Engineer</tspan>     GUILDS  <tspan fill="#fff" font-weight="700">Fractal · Allstate India · TechChef's</tspan></text>
    <line x1="40" y1="100" x2="700" y2="100" stroke="url(#edge)" stroke-opacity=".6" stroke-width="1.5"/>
  </g>

  <!-- stat rows -->
  <g class="t">
    <!-- 1 -->
    <circle cx="58" cy="146" r="18" fill="#2a1450" stroke="#ff4f8b" stroke-width="2"/>
    <text x="58" y="153" font-size="13" font-weight="900" text-anchor="middle" fill="#fff">PS</text>
    <text x="90" y="138" font-size="13" font-weight="800" letter-spacing="2.5" fill="#ffffff">PROBLEM SOLVING</text>
    <rect x="90" y="148" width="360" height="14" rx="7" fill="#2a1f4d"/>
    <rect class="fill" x="90" y="148" width="349" height="14" rx="7" fill="url(#bar)"/>
    <text x="466" y="160" font-size="13.5" fill="#d9d4f5">LeetCode Global #41 · 800+ solved</text>

    <!-- 2 -->
    <circle cx="58" cy="202" r="18" fill="#2a1450" stroke="#ff4f8b" stroke-width="2"/>
    <text x="58" y="209" font-size="13" font-weight="900" text-anchor="middle" fill="#fff">SD</text>
    <text x="90" y="194" font-size="13" font-weight="800" letter-spacing="2.5" fill="#ffffff">SYSTEM DESIGN</text>
    <rect x="90" y="204" width="360" height="14" rx="7" fill="#2a1f4d"/>
    <rect class="fill" x="90" y="204" width="324" height="14" rx="7" fill="url(#bar)" style="animation-delay:.15s"/>
    <text x="466" y="216" font-size="13.5" fill="#d9d4f5">50 LLD + 10 HLD open-sourced</text>

    <!-- 3 -->
    <circle cx="58" cy="258" r="18" fill="#2a1450" stroke="#ff4f8b" stroke-width="2"/>
    <text x="58" y="265" font-size="13" font-weight="900" text-anchor="middle" fill="#fff">FS</text>
    <text x="90" y="250" font-size="13" font-weight="800" letter-spacing="2.5" fill="#ffffff">FULL-STACK BUILD</text>
    <rect x="90" y="260" width="360" height="14" rx="7" fill="#2a1f4d"/>
    <rect class="fill" x="90" y="260" width="331" height="14" rx="7" fill="url(#bar)" style="animation-delay:.3s"/>
    <text x="466" y="272" font-size="13.5" fill="#d9d4f5">30 projects · best 12 live</text>

    <!-- 4 -->
    <circle cx="58" cy="314" r="18" fill="#2a1450" stroke="#ff4f8b" stroke-width="2"/>
    <text x="58" y="321" font-size="13" font-weight="900" text-anchor="middle" fill="#fff">PF</text>
    <text x="90" y="306" font-size="13" font-weight="800" letter-spacing="2.5" fill="#ffffff">PERFORMANCE</text>
    <rect x="90" y="316" width="360" height="14" rx="7" fill="#2a1f4d"/>
    <rect class="fill" x="90" y="316" width="317" height="14" rx="7" fill="url(#bar)" style="animation-delay:.45s"/>
    <text x="466" y="328" font-size="13.5" fill="#d9d4f5">k6: 0% failures @ 200 users</text>

    <!-- 5 -->
    <circle cx="58" cy="370" r="18" fill="#2a1450" stroke="#ff4f8b" stroke-width="2"/>
    <text x="58" y="377" font-size="13" font-weight="900" text-anchor="middle" fill="#fff">TC</text>
    <text x="90" y="362" font-size="13" font-weight="800" letter-spacing="2.5" fill="#ffffff">TEACHING</text>
    <rect x="90" y="372" width="360" height="14" rx="7" fill="#2a1f4d"/>
    <rect class="fill" x="90" y="372" width="324" height="14" rx="7" fill="url(#bar)" style="animation-delay:.6s"/>
    <text x="466" y="384" font-size="13.5" fill="#d9d4f5">3.32K subs · ~2,000 videos</text>
  </g>

  <!-- rank emblem -->
  <g class="t">
    <circle class="ring" cx="850" cy="240" r="98" fill="none" stroke="#ff4f8b" stroke-width="2.5" stroke-dasharray="7 11"/>
    <circle class="ring2" cx="850" cy="240" r="84" fill="none" stroke="#4de1ff" stroke-width="1.5" stroke-dasharray="3 9"/>
    <circle cx="850" cy="240" r="72" fill="#1d0d3a" stroke="url(#edge)" stroke-width="3"/>
    <text x="850" y="204" font-size="12" font-weight="800" letter-spacing="7" text-anchor="middle" fill="#b9b3d9">RANK</text>
    <text class="pulse" x="850" y="276" font-size="86" font-weight="900" text-anchor="middle" fill="url(#rank)" filter="url(#glow)">S</text>
    <text x="850" y="298" font-size="11" font-weight="800" letter-spacing="2" text-anchor="middle" fill="#4de1ff">LEETCODE #41</text>
  </g>

  <!-- bottom tiles -->
  <g class="t">
    <g>
      <rect x="40" y="414" width="215" height="58" rx="12" fill="#17112e" stroke="#ff4f8b" stroke-opacity=".6"/>
      <text x="147" y="444" font-size="26" font-weight="900" text-anchor="middle" fill="#ffffff">800+</text>
      <text x="147" y="463" font-size="10.5" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#8f89b8">PROBLEMS SOLVED</text>
    </g>
    <g>
      <rect x="275" y="414" width="215" height="58" rx="12" fill="#17112e" stroke="#ff4f8b" stroke-opacity=".6"/>
      <text x="382" y="444" font-size="26" font-weight="900" text-anchor="middle" fill="#ffffff">~2,000</text>
      <text x="382" y="463" font-size="10.5" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#8f89b8">VIDEOS TAUGHT</text>
    </g>
    <g>
      <rect x="510" y="414" width="215" height="58" rx="12" fill="#17112e" stroke="#4de1ff" stroke-opacity=".6"/>
      <text x="617" y="444" font-size="26" font-weight="900" text-anchor="middle" fill="#ffffff">30</text>
      <text x="617" y="463" font-size="10.5" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#8f89b8">PROJECTS SHIPPED</text>
    </g>
    <g>
      <rect x="745" y="414" width="215" height="58" rx="12" fill="#17112e" stroke="#4de1ff" stroke-opacity=".6"/>
      <text x="852" y="444" font-size="26" font-weight="900" text-anchor="middle" fill="#ffffff">2.5 YRS</text>
      <text x="852" y="463" font-size="10.5" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#8f89b8">INDUSTRY EXPERIENCE</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
