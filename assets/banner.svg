<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Manu Bharadwaj, Full-Stack Engineer, problem solver and teacher" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b14"/>
      <stop offset="1" stop-color="#12122b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="clip"><rect width="1000" height="340" rx="20"/></clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <ellipse cx="170" cy="50" rx="270" ry="120" fill="#7c5cff" opacity="0.38" filter="url(#blur)"/>
    <ellipse cx="860" cy="310" rx="300" ry="120" fill="#22d3ee" opacity="0.24" filter="url(#blur)"/>
    <ellipse cx="560" cy="20" rx="210" ry="80" fill="#ff7ac6" opacity="0.2" filter="url(#blur)"/>
    <rect width="1000" height="340" fill="url(#dots)"/>

    <g fill="#ffffff">
      <circle cx="610" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="975" cy="120" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="312" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="190" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="339" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="58" y="88" font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="13" letter-spacing="4" fill="#8b93b8">HELLO, WORLD. I'M</text>
    <text x="54" y="156" font-size="52" font-weight="800" letter-spacing="1" fill="url(#name)">MANU BHARADWAJ</text>
    <rect x="58" y="176" width="64" height="3" rx="1.5" fill="url(#bar)"/>
    <text x="58" y="210" font-size="19" fill="#e5e7f5">Full-stack engineer  ·  problem solver  ·  teacher</text>

    <g font-size="13" fill="#c9cdee" text-anchor="middle">
      <rect x="58" y="234" width="54" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="85" y="253">Java</text>
      <rect x="122" y="234" width="68" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="156" y="253">Python</text>
      <rect x="200" y="234" width="98" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="249" y="253">TypeScript</text>
      <rect x="308" y="234" width="61" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="338" y="253">React</text>
      <rect x="379" y="234" width="106" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="432" y="253">Spring Boot</text>
      <rect x="495" y="234" width="68" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="529" y="253">Django</text>
    </g>

    <circle cx="66" cy="296" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="301" font-size="14" letter-spacing="1.5" fill="#a7f3d0">Open to SDE roles</text>
  </g>

  <!-- code window -->
  <g font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace">
    <rect x="640" y="48" width="304" height="244" rx="14" fill="#0b0d1e" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="662" cy="72" r="5" fill="#ff5f57"/>
    <circle cx="680" cy="72" r="5" fill="#febc2e"/>
    <circle cx="698" cy="72" r="5" fill="#28c840"/>
    <text x="792" y="76" font-size="11" fill="#6b7299" text-anchor="middle">manu.ts</text>
    <line x1="640" y1="90" x2="944" y2="90" stroke="#ffffff" stroke-opacity="0.08"/>

    <g font-size="13">
      <text x="662" y="122"><tspan fill="#c4b5fd">const</tspan><tspan fill="#67e8f9"> manu</tspan><tspan fill="#e5e7f5"> = {</tspan></text>
      <text x="684" y="146"><tspan fill="#e5e7f5">role: </tspan><tspan fill="#fcd34d">"Full-Stack Engineer"</tspan><tspan fill="#e5e7f5">,</tspan></text>
      <text x="684" y="170"><tspan fill="#e5e7f5">leetcode: </tspan><tspan fill="#fcd34d">"#41 global"</tspan><tspan fill="#e5e7f5">,</tspan></text>
      <text x="684" y="194"><tspan fill="#e5e7f5">youtube: </tspan><tspan fill="#fcd34d">"3K+ subs"</tspan><tspan fill="#e5e7f5">,</tspan></text>
      <text x="684" y="218"><tspan fill="#e5e7f5">bugs: </tspan><tspan fill="#fcd34d">"negotiable"</tspan><tspan fill="#e5e7f5">,</tspan></text>
      <text x="662" y="242" fill="#e5e7f5">};</text>
      <text x="662" y="270"><tspan fill="#67e8f9">manu</tspan><tspan fill="#e5e7f5">.</tspan><tspan fill="#f9a8d4">openToWork</tspan><tspan fill="#e5e7f5">();</tspan></text>
      <rect x="800" y="258" width="8" height="16" fill="#67e8f9">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
