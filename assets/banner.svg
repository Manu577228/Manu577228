<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Manu Bharadwaj - Full-Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090418"/>
      <stop offset="0.5" stop-color="#2d0b4e"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.55" stop-color="#ff8fa3"/>
      <stop offset="1" stop-color="#ff3d81"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd6e8"/>
    </linearGradient>
    <mask id="sunmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="320">
      <rect width="1000" height="320" fill="#fff"/>
      <rect x="600" y="196" width="340" height="3" fill="#000"/>
      <rect x="600" y="212" width="340" height="5" fill="#000"/>
      <rect x="600" y="229" width="340" height="7" fill="#000"/>
      <rect x="600" y="248" width="340" height="9" fill="#000"/>
    </mask>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="320" rx="20"/></clipPath>
    <path id="petal" d="M0,0 C5,-9 17,-7 15,2 C13,11 2,11 0,0 Z"/>
  </defs>

  <style>
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .speed { stroke: #ffffff; stroke-width: 2; stroke-linecap: round; opacity: .35; stroke-dasharray: 60 340; animation: dash 2.4s linear infinite; }
    @keyframes dash { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    .petal { fill: #ffb7d5; opacity: .9; animation: fall 10s linear infinite; }
    @keyframes fall {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      8%   { opacity: .95; }
      100% { transform: translate(-190px, 390px) rotate(560deg); opacity: .2; }
    }
    .sun { animation: pulse 4s ease-in-out infinite; transform-origin: 770px 178px; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .gA { animation: gl 4s steps(1) infinite; }
    @keyframes gl {
      0%, 92%, 100% { transform: translate(0, 0); opacity: .0; }
      93% { transform: translate(-5px, 1px); opacity: .85; }
      95% { transform: translate(4px, -1px); opacity: .85; }
      97% { transform: translate(-2px, 0); opacity: .85; }
    }
    .fade { animation: fadein 1.4s ease-out both; }
    @keyframes fadein { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    .t { font-family: 'Segoe UI','Helvetica Neue',Arial,'Nirmala UI','Noto Sans Devanagari','Mangal',sans-serif; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle class="tw" cx="60" cy="30" r="1.6"/>
      <circle class="tw" cx="170" cy="62" r="1.2" style="animation-delay:-1s"/>
      <circle class="tw" cx="290" cy="24" r="1.8" style="animation-delay:-2s"/>
      <circle class="tw" cx="410" cy="50" r="1.2" style="animation-delay:-.5s"/>
      <circle class="tw" cx="520" cy="20" r="1.6" style="animation-delay:-1.5s"/>
      <circle class="tw" cx="610" cy="70" r="1.2" style="animation-delay:-2.5s"/>
      <circle class="tw" cx="930" cy="40" r="1.8" style="animation-delay:-.8s"/>
      <circle class="tw" cx="980" cy="110" r="1.2" style="animation-delay:-1.8s"/>
      <circle class="tw" cx="350" cy="100" r="1" style="animation-delay:-2.2s"/>
      <circle class="tw" cx="880" cy="22" r="1.2" style="animation-delay:-.2s"/>
    </g>

    <!-- sun -->
    <g class="sun" mask="url(#sunmask)" filter="url(#glow)">
      <circle cx="770" cy="178" r="112" fill="url(#sun)"/>
    </g>

    <!-- torii gate -->
    <g fill="#0b0419">
      <path d="M686 146 Q770 128 854 146 L854 160 Q770 142 686 160 Z"/>
      <rect x="706" y="176" width="128" height="9"/>
      <rect x="716" y="160" width="11" height="120"/>
      <rect x="813" y="160" width="11" height="120"/>
    </g>

    <!-- mountains -->
    <path d="M0 320 L0 246 L110 196 L205 242 L330 168 L450 238 L565 190 L690 252 L805 196 L915 244 L1000 212 L1000 320 Z" fill="#1b0a36" opacity=".92"/>
    <path d="M0 320 L0 278 L140 246 L260 280 L390 240 L520 284 L660 250 L800 286 L920 256 L1000 280 L1000 320 Z" fill="#0b0419"/>

    <!-- speed lines -->
    <g>
      <line class="speed" x1="0" y1="92" x2="470" y2="92"/>
      <line class="speed" x1="0" y1="212" x2="520" y2="212" style="animation-delay:-.9s"/>
      <line class="speed" x1="0" y1="262" x2="420" y2="262" style="animation-delay:-1.6s"/>
    </g>

    <!-- sakura petals -->
    <g>
      <use href="#petal" class="petal" x="900" y="-20" style="animation-duration:9s;animation-delay:-1s"/>
      <use href="#petal" class="petal" x="780" y="-20" style="animation-duration:11s;animation-delay:-4s"/>
      <use href="#petal" class="petal" x="1000" y="-20" style="animation-duration:8s;animation-delay:-2s"/>
      <use href="#petal" class="petal" x="640" y="-20" style="animation-duration:12s;animation-delay:-6s"/>
      <use href="#petal" class="petal" x="540" y="-20" style="animation-duration:10s;animation-delay:-3s"/>
      <use href="#petal" class="petal" x="860" y="-20" style="animation-duration:13s;animation-delay:-8s"/>
      <use href="#petal" class="petal" x="420" y="-20" style="animation-duration:9.5s;animation-delay:-5s"/>
      <use href="#petal" class="petal" x="960" y="-20" style="animation-duration:12s;animation-delay:-9s"/>
    </g>

    <!-- text -->
    <g class="t fade">
      <text x="52" y="66" font-size="14" font-weight="700" letter-spacing="6" fill="#4de1ff">SOFTWARE ENGINEER</text>

      <text class="gA" x="52" y="152" font-size="88" font-weight="900" fill="#4de1ff">MANU</text>
      <text class="gA" x="56" y="152" font-size="88" font-weight="900" fill="#ff4f8b" style="animation-delay:-.2s">MANU</text>
      <text x="52" y="152" font-size="88" font-weight="900" fill="url(#title)">MANU</text>

      <text x="52" y="224" font-size="66" font-weight="900" fill="url(#title)" letter-spacing="2">BHARADWAJ</text>

      <text x="54" y="262" font-size="26" font-weight="700" fill="#ff8fc0">मनु भारद्वाज</text>
      <text x="54" y="294" font-size="13.5" font-weight="700" fill="#cfe9ff" letter-spacing="2.5">FULL-STACK  ·  LEETCODE GLOBAL RANK #41  ·  3.32K STUDENTS</text>
    </g>

    <!-- border -->
    <rect x="1.5" y="1.5" width="997" height="317" rx="19" fill="none" stroke="#ff4f8b" stroke-opacity=".55" stroke-width="3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
