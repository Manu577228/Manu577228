<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 56" width="1000" height="56" role="presentation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f8b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="pt" d="M0,0 C4,-12 18,-12 16,-1 C14,8 3,8 0,0 Z"/>
    <clipPath id="lineclip"><rect x="0" y="26" width="1000" height="4"/></clipPath>
  </defs>
  <style>
    .sweep { animation: sw 3.6s ease-in-out infinite; }
    @keyframes sw { from { transform: translateX(-300px); } to { transform: translateX(1000px); } }
    .flower { transform-origin: 0px 0px; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { animation: tw 2.4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  </style>

  <rect x="20" y="26.5" width="960" height="3" rx="1.5" fill="url(#ln)"/>
  <g clip-path="url(#lineclip)"><rect class="sweep" x="0" y="26" width="260" height="4" fill="url(#shine)"/></g>

  <g transform="translate(500 28)"><g class="flower">
    <g fill="#ffb7d5">
      <use href="#pt" transform="rotate(0)"/>
      <use href="#pt" transform="rotate(72)"/>
      <use href="#pt" transform="rotate(144)"/>
      <use href="#pt" transform="rotate(216)"/>
      <use href="#pt" transform="rotate(288)"/>
    </g>
    <circle r="3.2" fill="#fff3b0"/>
  </g></g>

  <g fill="#4de1ff">
    <circle class="dot" cx="440" cy="28" r="2.4"/>
    <circle class="dot" cx="560" cy="28" r="2.4" style="animation-delay:-1.2s"/>
    <circle class="dot" cx="400" cy="28" r="1.6" style="animation-delay:-.6s"/>
    <circle class="dot" cx="600" cy="28" r="1.6" style="animation-delay:-1.8s"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
